spring:
  application:
    name: tpa-claim-processor

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:7003}/${DB_NAME:tpa_claim_db}}
    username: ${DB_USERNAME:tpa_user}
    password: ${DB_PASSWORD:tpa_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

app:
  storage:
    location: ${UPLOAD_DIR:storage/claims}

server:
  port: ${SERVER_PORT:7002}
  error:
    include-message: always
