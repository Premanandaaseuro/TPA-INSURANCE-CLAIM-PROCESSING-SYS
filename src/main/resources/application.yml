spring:
  application:
    name: tpa-claim-processor

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:tpa_claims_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

app:
  storage:
    location: ${UPLOAD_DIR:storage/claims}

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
