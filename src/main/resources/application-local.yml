spring:
  application:
    name: tpa-claim-processor-local

  datasource:
    url: jdbc:h2:mem:tpa_claim_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

app:
  storage:
    location: target/storage/claims

server:
  port: 7002
  error:
    include-message: always
