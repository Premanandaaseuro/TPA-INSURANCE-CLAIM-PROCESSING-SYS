spring:
  application:
    name: tpa-claim-processor-test

  datasource:
    url: jdbc:h2:mem:tpa_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  storage:
    location: target/test-storage/claims
