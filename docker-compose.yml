services:
  postgres:
    image: postgres:17-alpine
    container_name: tpa_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-tpa_claim_db}
      POSTGRES_USER: ${DB_USERNAME:-tpa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tpa_password}
    ports:
      - "${HOST_DB_PORT:-7003}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tpa_user} -d ${DB_NAME:-tpa_claim_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tpa_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-7002}:7002"
    environment:
      SERVER_PORT: 7002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tpa_claim_db}
      DB_USERNAME: ${DB_USERNAME:-tpa_user}
      DB_PASSWORD: ${DB_PASSWORD:-tpa_password}
      UPLOAD_DIR: ${UPLOAD_DIR:-storage/claims}
    volumes:
      - claim_storage:/app/storage/claims

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tpa_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-7001}:7001"

volumes:
  postgres_data:
  claim_storage:
